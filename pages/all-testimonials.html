<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Testimonials | Travel</title>
    <link rel="stylesheet" href="../css/general.css">
    <link rel="stylesheet" href="../css/testimonials.css">
</head>
<body>
    <div class="container">
        <header>
        <div class="logo"><img src="../img/logo.svg" alt="Логотип Travel"></div>
        <div class="right-div-header">
            <nav>
                <ul>
                    <li><a href="home.html" data-i18n="home">Главная</a></li>
                    <li><a href="destinations.html" data-i18n="destinations">Направления</a></li>
                    <li><a href="#" data-i18n="about">О нас</a></li>
                    <li><a href="#" data-i18n="partner">Партнеры</a></li>
                </ul>
            </nav>
            <div class="auth-buttons">
                <a href="login.html" class="login" id="login-btn" data-i18n="login">Вход</a>
                <a href="register.html" class="register" id="register-btn" data-i18n="register">Регистрация</a>
                
                <div class="user-menu" id="user-menu" style="display: none;">
                    <button class="user-btn" id="user-btn">
                        <span id="username-display">Пользователь</span>
                        <svg width="12" height="8" viewBox="0 0 12 8" fill="none">
                            <path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    </button>
                    <div class="dropdown-menu" id="dropdown-menu">
                        <div class="dropdown-header">
                            <span id="dropdown-username">Имя пользователя</span>
                        </div>
                        <button class="dropdown-item" id="settings-btn" data-i18n="settings">Настройки</button>
                        <button class="dropdown-item logout-btn" id="logout-btn" data-i18n="logout">Выход</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 data-i18n="settings">Настройки</h2>
            
            <div class="settings-section">
                <h3 data-i18n="language">Язык / Language</h3>
                <select id="language-select">
                    <option value="ru">Русский</option>
                    <option value="en">English</option>
                </select>
            </div>
            
            <div class="settings-section">
                <h3 data-i18n="fontSize">Размер шрифта</h3>
                <div class="font-size-buttons">
                    <button data-size="small" data-i18n="small">Маленький</button>
                    <button data-size="medium" class="active" data-i18n="medium">Средний</button>
                    <button data-size="large" data-i18n="large">Большой</button>
                </div>
            </div>
            
            <div class="settings-section">
                <h3 data-i18n="colorScheme">Цветовая схема</h3>
                <div class="color-schemes">
                    <div class="color-scheme" data-scheme="dark-white">
                        <div class="color-preview dark-white"></div>
                        <span data-i18n="darkWhite">Черный/Белый</span>
                    </div>
                    <div class="color-scheme" data-scheme="dark-green">
                        <div class="color-preview dark-green"></div>
                        <span data-i18n="darkGreen">Черный/Зеленый</span>
                    </div>
                    <div class="color-scheme" data-scheme="light-black">
                        <div class="color-preview light-black"></div>
                        <span data-i18n="lightBlack">Белый/Черный</span>
                    </div>
                    <div class="color-scheme" data-scheme="beige-brown">
                        <div class="color-preview beige-brown"></div>
                        <span data-i18n="beigeBrown">Бежевый/Коричневый</span>
                    </div>
                    <div class="color-scheme" data-scheme="blue-darkblue">
                        <div class="color-preview blue-darkblue"></div>
                        <span data-i18n="blueDarkblue">Голубой/Темно-синий</span>
                    </div>
                </div>
            </div>
            
            <div class="settings-section">
                <h3 data-i18n="accessibility">Версия для слабовидящих</h3>
                <label class="switch">
                    <input type="checkbox" id="accessibility-toggle">
                    <span class="slider"></span>
                </label>
                <div id="accessibility-options" style="display: none;">
                    <label>
                        <input type="checkbox" id="disable-images">
                        <span data-i18n="disableImages">Отключить изображения</span>
                    </label>
                </div>
            </div>
            
            <button class="reset-btn" id="reset-settings" data-i18n="reset">Сбросить настройки</button>
        </div>
    </div>

        <main class="testimonials-page">
            <h1 class="page-title">All Testimonials</h1>
            
            <div class="controls-panel">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search testimonials...">
                    <button id="searchBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                </div>
                
                <div class="filters">
                    <select id="ratingFilter">
                        <option value="0">All Ratings</option>
                        <option value="5">5 Stars</option>
                        <option value="4">4 Stars</option>
                        <option value="3">3 Stars</option>
                    </select>
                    
                    <select id="sortBy">
                        <option value="rating-desc">Highest Rating</option>
                        <option value="rating-asc">Lowest Rating</option>
                        <option value="author-asc">Author (A-Z)</option>
                        <option value="author-desc">Author (Z-A)</option>
                    </select>
                </div>
            </div>
            
            <div class="testimonials-grid" id="testimonialsGrid">
            </div>
            
            <div class="pagination" id="pagination">
            </div>
        </main>

        <footer>
        </footer>
    </div>

    <script src="../js/testimonials/all-testimonials.js"></script>
    <script src="../js/i18n/i18n.js"></script>
    <script src="../js/menu-user/menu.js"></script>
</body>
</html>
