<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отзывы</title>
    <link rel="stylesheet" href="../css/reviews.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">TravelReviews</div>
            <nav>
                <a href="../index.html">Главная</a>
                <a href="#" class="active">Отзывы</a>
            </nav>
            <div class="user-menu" id="user-menu"></div>
        </div>
    </header>
    
    <main class="container">
        <h1>Отзывы наших клиентов</h1>
        
        <div class="reviews-actions">
            <button id="add-review-btn">Добавить отзыв</button>
        </div>
        
        <div class="reviews-list" id="reviews-list"></div>
        
        <div class="pagination" id="pagination">
            <button id="prev-page" disabled>Назад</button>
            <div class="page-numbers" id="page-numbers"></div>
            <button id="next-page">Вперед</button>
        </div>
    </main>

    <div class="modal" id="review-modal">
        <div class="modal-content">
            <span class="close-btn">×</span>
            <h2>Добавить отзыв</h2>
            <form id="review-form">
                <div class="form-group">
                    <label for="review-rating">Оценка</label>
                    <select id="review-rating" required>
                        <option value="5">★★★★★</option>
                        <option value="4">★★★★☆</option>
                        <option value="3">★★★☆☆</option>
                        <option value="2">★★☆☆☆</option>
                        <option value="1">★☆☆☆☆</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="review-text">Текст отзыва</label>
                    <textarea id="review-text" required></textarea>
                </div>
                <button type="submit">Отправить</button>
            </form>
        </div>
    </div>
    
    <script src="../js/utils.js"></script>
    <script src="../js/reviews.js"></script>
</body>
</html>
