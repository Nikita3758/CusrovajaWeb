<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="login">Вход</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="auth-container">
        <h1 data-i18n="login">Вход</h1>
        
        <form id="login-form">
            <div class="form-group">
                <label for="login-email" data-i18n="user">Email или телефон</label>
                <input type="text" id="login-email" name="login" required>
                <div class="error-message" id="login-error"></div>
            </div>
            
            <div class="form-group">
                <label for="login-password" data-i18n="password">Пароль</label>
                <input type="password" id="login-password" name="password" required>
                <div class="error-message" id="password-error"></div>
            </div>
            
            <button type="submit" data-i18n="login">Войти</button>
        </form>
        
        <p class="auth-link">
            <span data-i18n="noAccount">Нет аккаунта?</span> 
            <a href="register.html" data-i18n="register">Зарегистрироваться</a>
        </p>
    </div>
    
    <script src="../js/auth/login.js"></script>
    <script src="../js/i18n/i18n.js"></script>
    <script src="../js/burger-menu/burger-menu.js"></script>
</body>
</html>
